<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compro Oro - Perfil</title>

    <link rel="stylesheet" href="KIMANFER.css">

</head>

<body>

    <!-- CABECERA -->

    <header class="header">

        <a href="index.html" class="logo">
            <img src="logo_pequeño.jpg" alt="Logo KIMANFER">
            <span class="logo-text">
                <strong>KIMANFER</strong>
            </span>
        </a>

        <nav class="main-nav">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="tiendas.html">Tiendas</a>
            <a href="articulo.html">Artículo</a>
            <a href="perfil.html">Perfil</a>
        </nav>

    </header>


    <!-- PERFIL -->

    <main class="container">

        <div class="profile">

            <div class="avatar">

                <img src="Sinfoto.jpg" alt="">

            </div>


            <h1>
                Nombre
            </h1>


            <p class="location">
                📍 Lugar
            </p>


            <!-- INFORMACIÓN PERSONAL -->

            <section class="profile-form">

                <h2>
                    Información personal
                </h2>


                <form action="#" method="post">

                    <div class="form-group">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input type="text" id="nombre" name="nombre" value="Nombre" required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                    </div>


                    <div class="form-group">

                        <label for="telefono">
                            Teléfono
                        </label>

                        <input type="tel" id="telefono" name="telefono" placeholder="600 000 000">

                    </div>


                    <div class="form-group">

                        <label for="tipo">
                            ¿Qué te interesa?
                        </label>

                        <select id="tipo" name="tipo">

                            <option value="comprar">
                                Comprar oro
                            </option>

                            <option value="vender">
                                Vender oro
                            </option>

                            <option value="informacion">
                                Solicitar información
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="mensaje">
                            Mensaje
                        </label>

                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>

                    </div>


                    <button type="submit" class="btn">
                        Guardar información
                    </button>

                </form>

            </section>


            <!-- OPCIONES -->

            <div class="settings">

                <a href="#">
                    <span class="setting-icon">
                        🔔
                    </span>
                    Notificaciones
                </a>


                <a href="productos.html">
                    <span class="setting-icon">
                        ♡
                    </span>
                    Productos guardados
                </a>


                <a href="#">
                    <span class="setting-icon">
                        ⚙
                    </span>
                    Configuración
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Compro Oro · Todos los derechos reservados

    </footer>

</body>

</html>
